<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03040A"/><stop offset="1" stop-color="#071022"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7DF9FF"/><stop offset="0.5" stop-color="#E0FBFF"/><stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.18"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#22D3EE" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <style>
      .t{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
      .m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
      .blink{animation:b 1.2s steps(2) infinite}
      @keyframes b{50%{opacity:0}}
      .sweep{animation:s 4s linear infinite}
      @keyframes s{0%{transform:translateY(-120px)}100%{transform:translateY(360px)}}
      .pulse{animation:p 2.4s ease-in-out infinite}
      @keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>
  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <g stroke="#22D3EE" stroke-opacity="0.12">
    <path d="M600 340 L0 240 M600 340 L200 240 M600 340 L400 240 M600 340 L600 240 M600 340 L800 240 M600 340 L1000 240 M600 340 L1200 240"/>
  </g>
  <rect class="sweep" x="0" y="0" width="1200" height="110" fill="url(#scan)"/>
  <g stroke="#22D3EE" stroke-width="2" fill="none" stroke-opacity="0.9">
    <path d="M30 60V30H60"/><path d="M1140 30H1170V60"/><path d="M30 280V310H60"/><path d="M1140 310H1170V280"/>
  </g>
  <text x="60" y="52" class="m" font-size="13" fill="#22D3EE" fill-opacity="0.8" letter-spacing="3">SYS://MIDNIGHTLAB  ·  NODE DXB-01</text>
  <circle class="pulse" cx="1060" cy="47" r="5" fill="#34D399"/><text x="1140" y="52" class="m" font-size="13" fill="#A78BFA" text-anchor="end" letter-spacing="3">ONLINE</text>
  <text x="600" y="185" class="t" font-size="92" font-weight="800" text-anchor="middle" letter-spacing="14" fill="url(#txt)" filter="url(#glow)">MIDNIGHTLAB</text>
  <text x="600" y="232" class="m" font-size="18" text-anchor="middle" fill="#9FB3C8" letter-spacing="6">STRATEGIST BY DAY  /  BUILDER BY NIGHT</text>
  <text x="60" y="298" class="m" font-size="12" fill="#5B6B80" letter-spacing="3">LAT 25.20 N  ·  LON 55.27 E</text>
  <text x="1140" y="298" class="m" font-size="12" fill="#5B6B80" text-anchor="end" letter-spacing="3">BUILD 2026.11</text>
</svg>
